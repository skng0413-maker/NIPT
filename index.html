    // Show non-blocking toast notification

      toastEl.textContent = msg;

      toastEl.classList.add("opacity-100");

    // Escape special characters for safe regex creation
    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    // Escape HTML to prevent XSS
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Highlight matching substring with <mark>
    function highlight(text, query) {
      const safeText = escapeHTML(text);
      if (!query) return safeText;
      const safeQuery = escapeHTML(query);
      const regex = new RegExp(`(${escapeRegExp(safeQuery)})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    // Get category color styling
    function getCategoryBadgeStyle(cat) {
      switch (cat) {
        case "NDD": return "text-purple-400";
        case "SKEL": return "text-orange-400";
        case "RAS": return "text-emerald-400";
        case "OTHER": return "text-pink-400";
        case "DEL": return "text-rose-400";
        case "DUP": return "text-cyan-400";
        case "NAMED": return "text-amber-400";
        case "SEX": return "text-indigo-400";
        default: return "text-slate-400";
      }
    }

      }
      return ALL_ITEMS;

      }
      if (item.inh === "AD") return "遺傳: 常染色體顯性 (AD)";
      if (item.inh === "XLD") return "遺傳: X-連鎖顯性 (XLD)";
      if (item.inh === "XL") return "遺傳: X-連鎖遺傳 (XL)";
      return `遺傳: ${item.inh}`;
    }

    // Build dynamic category chips matching the selected panel mode
    function renderFilterChips() {
      let chips = [{ cat: "ALL", label: "全部顯示" }];

      if (currentMode === "ALL") {
        chips.push(
          { cat: "PANEL_BLESS", label: "僅看寶兒安 BlessGD/T (92)" },
          { cat: "PANEL_T21", label: "僅看敏兒安 safeT21 (126)" },
          { cat: "DEL", label: "微缺失/單體症" },
          { cat: "DUP", label: "微重複/三倍體" },
          { cat: "NDD", label: "智力/神經發展" },
          { cat: "SKEL", label: "骨骼/顱縫異常" },
          { cat: "RAS", label: "努南氏症譜系" }
        );
      } else if (currentMode === "BLESS_STD") {
        chips.push(
          { cat: "NDD", label: "智力/神經發展障礙" },
          { cat: "SKEL", label: "骨骼/顱縫早閉異常" },
          { cat: "RAS", label: "努南氏症候群譜系" },
          { cat: "OTHER", label: "結節性硬化/其他異常" }
        );
      } else if (currentMode === "BLESS_TWINS") {
        chips.push(
          { cat: "TWINS_ADD", label: "僅看雙胞胎新增 (+26)" },
          { cat: "NDD", label: "智力/神經發展障礙" },
          { cat: "SKEL", label: "骨骼/顱縫早閉異常" },
          { cat: "RAS", label: "努南氏症候群譜系" },
          { cat: "OTHER", label: "結節性硬化/其他異常" }
        );
      } else if (currentMode === "SAFET21") {
        chips.push(
          { cat: "DEL", label: "微缺失/單體症" },
          { cat: "DUP", label: "微重複/三倍體" },
          { cat: "NAMED", label: "命名綜合症/其他" },
          { cat: "SEX", label: "X染色體微缺失/重複" }
        );
      }

      // Reset currentCat if invalid for the new mode
      if (!chips.some(c => c.cat === currentCat)) {
        currentCat = "ALL";
      }

      filterBar.innerHTML = chips.map(c => {
        const isActive = c.cat === currentCat;
        const activeStyle = isActive
          ? "bg-sky-500/15 border-sky-500 text-sky-400 font-semibold"
          : "bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200 font-medium";
        return `
          <button type="button" data-cat="${c.cat}"
            class="chip px-3 py-1.5 rounded-lg text-xs whitespace-nowrap border transition ${activeStyle}">
            ${c.label}
          </button>
        `;
      }).join("");
    }

    // Main render loop
    function render() {
      const pool = getActivePool();
      const rawQ = currentQuery.trim();
      const q = rawQ.toLowerCase();

      if (q) {
        clearBtn.classList.remove("hidden");
        clearBtn.classList.add("flex");
      } else {
        clearBtn.classList.add("hidden");
        clearBtn.classList.remove("flex");
      }

      const filtered = pool.filter(item => {
        if (currentCat === "PANEL_BLESS" && item.panel !== "BLESS") return false;
        if (currentCat === "PANEL_T21" && item.panel !== "SAFET21") return false;
        if (currentCat === "TWINS_ADD" && !item.twinsOnly) return false;
        if (
          currentCat !== "ALL" &&
          currentCat !== "PANEL_BLESS" &&
          currentCat !== "PANEL_T21" &&
          currentCat !== "TWINS_ADD" &&
          item.cat !== currentCat
        ) {
          return false;
        }

        if (!q) return true;

        const padLen = item.panel === "SAFET21" ? 3 : 2;
        const paddedId = String(item.id).padStart(padLen, "0");
        const panelKeywords = item.panel === "SAFET21"
          ? "safet21 safet21express 敏兒安 微缺失 微重複 cnv ≥3mb"
          : (item.twinsOnly ? "blessgd blessgdt 寶兒安 雙胞胎 twins 92" : "blessgd 寶兒安 單胎 66");
        const rightMeta = getRightMetaLabel(item);

        const searchable = `${item.id} ${paddedId} #${paddedId} ${item.zh} ${item.en} ${item.locus} ${item.inh || ""} ${rightMeta} ${item.catName} ${panelKeywords}`.toLowerCase();
        return searchable.includes(q);
      });

      lastFiltered = filtered;
      countBadge.textContent = `${filtered.length} / ${pool.length}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="col-span-full text-center py-12 px-4 bg-slate-900/50 border border-slate-800 rounded-2xl">
            <p class="text-slate-400 text-sm">找不到包含「<span class="text-amber-300 font-semibold">${escapeHTML(rawQ)}</span>」的疾病、基因或染色體區段</p>
            <p class="text-slate-500 text-xs mt-1">請嘗試其他關鍵字，或確認上方已選擇「全部整合 (218項)」</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const isSafeT21 = item.panel === "SAFET21";
        const padLen = isSafeT21 ? 3 : 2;
        const paddedId = String(item.id).padStart(padLen, "0");
        const idStr = highlight(paddedId, rawQ);
        const zhStr = highlight(item.zh, rawQ);
        const enStr = highlight(item.en, rawQ);
        const locusStr = highlight(item.locus, rawQ);
        const catStr = highlight(item.catName, rawQ);
        const catColor = getCategoryBadgeStyle(item.cat);

        // Distinct accent border & badge per panel
        let borderStyle = "border-slate-800 border-l-4 border-l-sky-500";
        let idColor = "text-sky-400";
        let panelBadge = `<span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-sky-500/15 text-sky-300 border border-sky-500/30">BlessGD</span>`;

        if (isSafeT21) {
          borderStyle = "border-slate-800 border-l-4 border-l-emerald-400";
          idColor = "text-emerald-400";
          panelBadge = `<span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">safeT21</span>`;
        } else if (item.twinsOnly) {
          borderStyle = "border-slate-800 border-l-4 border-l-violet-400";
          idColor = "text-violet-400";
          panelBadge = `<span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-violet-500/20 text-violet-300 border border-violet-500/30">BlessGDT+</span>`;
        }

        return `
          <article class="bg-slate-900/90 hover:bg-slate-850 border ${borderStyle} rounded-xl p-3 flex flex-col justify-between gap-1.5 transition shadow-sm">
            <div>
              <div class="flex items-start justify-between gap-2">
                <h2 class="text-sm font-semibold text-slate-100 leading-snug">
                  <span class="${idColor} font-mono text-xs mr-1">#${idStr}</span>${zhStr}
                </h2>
                <div class="flex items-center gap-1 shrink-0 flex-wrap justify-end">
                  ${panelBadge}
                  <span class="px-1.5 py-0.5 text-[11px] font-mono font-bold rounded bg-slate-800 text-slate-200 border border-slate-700">${locusStr}</span>
                </div>
              </div>
              <p class="text-xs text-slate-400 mt-1 leading-relaxed">${enStr}</p>
            </div>

            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1.5 mt-0.5 border-t border-slate-800/80">
              <span class="${catColor} font-medium">● ${catStr}</span>
              <span class="text-slate-400">${getRightMetaLabel(item)}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    // Switch between 4 Panel Modes
    function setMode(mode) {
      currentMode = mode;

      const baseBtn = "py-2 px-2.5 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1 bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700";
      btnAll.className = baseBtn;
      btnStd.className = baseBtn;
      btnTwins.className = baseBtn;
      btnSafeT21.className = baseBtn;

      if (mode === "ALL") {
        btnAll.className = "py-2 px-2.5 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1 bg-amber-500/15 border-amber-400 text-amber-300 shadow-sm";
        subTitle.textContent = "全部整合檢索 · 218項";
        subTitle.className = "text-xs sm:text-sm font-semibold text-amber-400";
      } else if (mode === "BLESS_STD") {
        btnStd.className = "py-2 px-2.5 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1 bg-sky-500/15 border-sky-500 text-sky-400 shadow-sm";
        subTitle.textContent = "寶兒安 BlessGD 單胎 · 66種單基因病";
        subTitle.className = "text-xs sm:text-sm font-semibold text-sky-400";
      } else if (mode === "BLESS_TWINS") {
        btnTwins.className = "py-2 px-2.5 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1 bg-violet-500/15 border-violet-400 text-violet-300 shadow-sm";
        subTitle.textContent = "寶兒安 BlessGDT 雙胞胎 · 92種單基因病";
        subTitle.className = "text-xs sm:text-sm font-semibold text-violet-300";
      } else if (mode === "SAFET21") {
        btnSafeT21.className = "py-2 px-2.5 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1 bg-emerald-500/15 border-emerald-400 text-emerald-300 shadow-sm";
        subTitle.textContent = "敏兒安 safeT21express™ 進階版 · 126種微缺失/重複 (≥3Mb)";
        subTitle.className = "text-xs sm:text-sm font-semibold text-emerald-400";
      }

      renderFilterChips();
      render();
    }

    // Event Listeners
    btnAll.addEventListener("click", () => setMode("ALL"));
    btnStd.addEventListener("click", () => setMode("BLESS_STD"));
    btnTwins.addEventListener("click", () => setMode("BLESS_TWINS"));
    btnSafeT21.addEventListener("click", () => setMode("SAFET21"));

    searchInput.addEventListener("input", (e) => {
      currentQuery = e.target.value;
      render();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      currentQuery = "";
      searchInput.focus();
      render();
    });

    filterBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      currentCat = btn.dataset.cat;
      renderFilterChips();
      render();
    });

    // Copy filtered results using fallback-safe textarea + document.execCommand('copy')
    document.getElementById("copyBtn").addEventListener("click", () => {
      if (lastFiltered.length === 0) {
        showToast("目前沒有可複製的篩選結果");
        return;
      }
      const modeNames = {
        ALL: "全部整合檢索 (BlessGD/T + safeT21express)",
        BLESS_STD: "寶兒安 BlessGD™ 單胎標準版",
        BLESS_TWINS: "寶兒安 BlessGDT™ 雙胞胎升級版",
        SAFET21: "敏兒安 safeT21express™ 進階版 (≥3Mb)"
      };
      const headerLine = `【${modeNames[currentMode]}】共 ${lastFiltered.length} 項結果${currentQuery.trim() ? `（關鍵字：${currentQuery.trim()}）` : ""}`;
      const lines = lastFiltered.map(d => {
        const tag = d.panel === "SAFET21" ? "safeT21" : (d.twinsOnly ? "BlessGDT+" : "BlessGD");
        const padLen = d.panel === "SAFET21" ? 3 : 2;
        return `[${tag}] #${String(d.id).padStart(padLen, "0")} [${d.locus}] ${d.zh} (${d.en})`;
      });
      const textToCopy = [headerLine, ...lines].join("\n");

      const textarea = document.createElement("textarea");
      textarea.value = textToCopy;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
        showToast(`已複製 ${lastFiltered.length} 筆資料`);
      } catch (err) {
        showToast("複製失敗，請手動選取");
      } finally {
        document.body.removeChild(textarea);
      }
    });

    // Export JSON
    document.getElementById("exportBtn").addEventListener("click", () => {
      try {
        const blob = new Blob([JSON.stringify(ALL_ITEMS, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "blessgd_safet21_218_items.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("已匯出完整 218 項 JSON 檔案");
      } catch (err) {
        showToast("匯出失敗");
      }
    });

    // Import JSON
    const fileInput = document.getElementById("fileInput");
    document.getElementById("importBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].zh && (parsed[0].locus || parsed[0].gene)) {
            ALL_ITEMS = parsed.map(item => ({
              ...item,
              panel: item.panel || "BLESS",
              locus: item.locus || item.gene
            }));
            render();
            showToast(`成功匯入 ${ALL_ITEMS.length} 筆資料`);
          } else {
            showToast("JSON 格式不符（需包含 zh 與 locus/gene 欄位）");
          }
        } catch (err) {
          showToast("無法解析 JSON 檔案");
        }
      };
      reader.readAsText(file);
      fileInput.value = "";
    });

    // Initial render
    setMode("ALL");
  </script>
</body>
</html>
